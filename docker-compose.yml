version: "3.9"

services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/clockify}
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  client:
    build:
      context: ./clockify
    restart: unless-stopped
    environment:
      - PORT=3006
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:5000/api}
    depends_on:
      - server
    ports:
      - "3006:3006"

volumes:
  mongo_data:
